<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Sold Property · Realty Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
<script src="/js/sidebar.js"></script>
<main class="main">

<div class="page-header">
  <div>
    <h1>Add Sold Property</h1>
    <p>Log the details of a property that was just sold (nabenta).</p>
  </div>
</div>

<div id="alertBox"></div>

<div class="card">
  <form id="saleForm" class="form-grid" novalidate>
    <div class="field">
      <label for="property_name">Property Name / Unit</label>
      <input type="text" id="property_name" name="property_name" placeholder="e.g. Sunrise Villas Blk 3 Lot 12" required>
    </div>

    <div class="field">
      <label for="property_type">Property Type</label>
      <select id="property_type" name="property_type" required>
        <option value="">Select type</option>
      </select>
    </div>

    <div class="field">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="e.g. Cavite">
    </div>

    <div class="field">
      <label for="price">Selling Price (₱)</label>
      <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g. 4500000" required>
    </div>

    <div class="field">
      <label for="buyer_name">Buyer's Full Name</label>
      <input type="text" id="buyer_name" name="buyer_name" placeholder="e.g. Maria Santos Dela Cruz" required>
    </div>

    <div class="field">
      <label for="buyer_contact">Buyer Contact</label>
      <input type="text" id="buyer_contact" name="buyer_contact" placeholder="e.g. 0917-111-2222">
    </div>

    <div class="field">
      <label for="agent_name">Sales Agent</label>
      <input type="text" id="agent_name" name="agent_name" placeholder="e.g. Jenny Cruz" required>
    </div>

    <div class="field">
      <label for="date_sold">Date Sold</label>
      <input type="date" id="date_sold" name="date_sold" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Sale</button>
      <a href="/sales" class="btn btn-ghost">View All Sales</a>
    </div>
  </form>
</div>

</main>
</div>

<script src="/js/utils.js"></script>
<script>
const typeSelect = document.getElementById('property_type');
PROPERTY_TYPES.forEach((t) => {
  const opt = document.createElement('option');
  opt.value = t;
  opt.textContent = t;
  typeSelect.appendChild(opt);
});
document.getElementById('date_sold').value = new Date().toISOString().slice(0, 10);

const alertBox = document.getElementById('alertBox');
const form = document.getElementById('saleForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.innerHTML = '';

  const payload = {
    property_name: form.property_name.value,
    property_type: form.property_type.value,
    location: form.location.value,
    buyer_name: form.buyer_name.value,
    buyer_contact: form.buyer_contact.value,
    price: parseFloat(form.price.value),
    agent_name: form.agent_name.value,
    date_sold: form.date_sold.value,
  };

  try {
    await api('/api/sales', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    alertBox.innerHTML = `<div class="alert alert-success">Sale recorded successfully. <a href="/sales">View all sales</a> or add another below.</div>`;
    form.reset();
    document.getElementById('date_sold').value = new Date().toISOString().slice(0, 10);
  } catch (err) {
    const messages = (err.data && err.data.errors) || [err.message];
    alertBox.innerHTML = `<div class="alert alert-error">${messages.map(escapeHtml).join('<br>')}</div>`;
  }
});
</script>
</body>
</html>
